<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'nonce-{{NONCE}}' {{CSP_SOURCE}}; style-src {{CSP_SOURCE}} 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Usage</title>
  <link rel="stylesheet" href="{{CSS_URI}}">
</head>

<body>
  <div id="controls">
    <div id="range-controls">
      <div class="control-group">
        <span class="control-label">Focus</span>
        <button data-view="current-session">Current session</button>
        <button data-view="current-week">Current week</button>
        <button data-view="today">Today</button>
      </div>
      <div class="control-group">
        <span class="control-label">Range</span>
        <button data-view="range:3600000">1h</button>
        <button data-view="range:21600000">6h</button>
        <button data-view="range:86400000">1d</button>
        <button data-view="range:604800000">7d</button>
        <button data-view="range:2592000000">30d</button>
      </div>
    </div>
    <div id="overlay-controls">
      <label><input type="checkbox" data-toggle="showSessionResetMarkers"> Session resets</label>
      <label><input type="checkbox" data-toggle="showWeeklyResetMarkers"> Weekly resets</label>
      <label><input type="checkbox" data-toggle="showWeeklyForecast"> Weekly forecast</label>
    </div>
  </div>
  <div id="forecast-summary">Weekly forecast: —</div>
  <div id="empty">No data yet — usage will appear after the first refresh.</div>
  <div id="chart-wrap"><canvas id="chart"></canvas></div>
  <div id="footer">Last updated: <span id="last-updated">—</span></div>

  <script nonce="{{NONCE}}">
    window.__INITIAL_ENTRIES__ = {{INITIAL_ENTRIES}};
    window.__INITIAL_SHOW_USED__ = {{INITIAL_SHOW_USED}};
    window.__INITIAL_SETTINGS__ = {{INITIAL_SETTINGS}};
    window.__INITIAL_ACTIVE_VIEW__ = {{INITIAL_ACTIVE_VIEW}};
  </script>
  <script nonce="{{NONCE}}" src="{{CHART_URI}}"></script>
  <script nonce="{{NONCE}}" src="{{JS_URI}}"></script>
</body>

</html>
